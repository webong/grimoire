extend type GraphNode {
    invocation: GraphInvocation
}

type GraphInvocation {
    id: ID!
    invocationId: ID! @rename(attribute: "invocation_id")
    traceId: ID @rename(attribute: "trace_id")
    parentInvocationId: ID @rename(attribute: "parent_invocation_id")
    status: String!
    createdAt: String @rename(attribute: "created_at")
}
